<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6fa8">
<title>Shamirah — Love You Babe 😘</title>
<style>
:root{--pink:#ff4f91;--rose:#ff9fc4;--purple:#9864e8;--ink:#652d4c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#ffe0ee 0,transparent 34%),radial-gradient(circle at 85% 80%,#e9dcff 0,transparent 36%),linear-gradient(135deg,#fff6fa,#ffe5ef 48%,#f4eaff);overflow-x:hidden}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.heart{position:absolute;bottom:-50px;color:#ff6fa5;opacity:.45;animation:floatUp linear infinite;filter:drop-shadow(0 4px 8px #ff8db855)}@keyframes floatUp{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}
.wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 14px}.card{width:min(100%,590px);padding:clamp(23px,6vw,46px);border:1px solid #ffffffd9;border-radius:32px;background:#ffffffcf;backdrop-filter:blur(18px);box-shadow:0 24px 70px #b54b7c26;text-align:center;animation:arrive .65s cubic-bezier(.2,.8,.2,1)}@keyframes arrive{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:#b04c79;font-weight:800}.pill{display:inline-block;background:#ffe5f0;padding:8px 12px;border-radius:99px;letter-spacing:.04em;font-size:.82rem}.logo{font-size:clamp(2.8rem,9vw,4.5rem);line-height:1;margin:12px 0 18px;filter:drop-shadow(0 8px 14px #f38ab455);animation:pulse 2.2s infinite}@keyframes pulse{50%{transform:scale(1.08)}}h1{font-size:clamp(2rem,7vw,3.1rem);line-height:1.08;margin:0 0 14px;color:#c52d70}h2{font-size:clamp(1.45rem,5vw,2.05rem);line-height:1.2;margin:10px 0 14px;color:#a52e69}.subtitle{font-size:1.02rem;line-height:1.7;color:#79536a;margin:0 auto 25px;max-width:440px}.question{font-size:1.18rem;line-height:1.55;font-weight:800;color:#65304e;margin:24px auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0}.choice{border:1.5px solid #f5b4d0;background:#fff7fb;color:#87415f;border-radius:17px;padding:16px 12px;font:inherit;font-size:1.05rem;font-weight:850;cursor:pointer;transition:.2s}.choice:hover,.choice.selected{transform:translateY(-3px);border-color:#ed5796;background:#ffe3ef;box-shadow:0 8px 20px #e95b9822}.choice:disabled{cursor:default}.btn{border:0;border-radius:99px;padding:15px 27px;background:linear-gradient(110deg,#ff4f91,#bd55d9);color:white;font:inherit;font-weight:850;font-size:1rem;cursor:pointer;box-shadow:0 10px 24px #e94f963b;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 14px 28px #e94f9655}.btn.secondary{background:#fff;color:#b23f78;border:1px solid #f4b3ce;box-shadow:none}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}.feedback{min-height:52px;margin:15px auto 0;padding:13px 15px;border-radius:16px;font-weight:800;line-height:1.45;background:#fff0f6;color:#ae3e73}.feedback.good{background:#e9fff3;color:#26764c}.feedback.bad{background:#fff0f2;color:#bd365c;animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}.progress{height:8px;background:#f8d8e7;border-radius:20px;overflow:hidden;flex:1}.bar{height:100%;background:linear-gradient(90deg,#ff5d9b,#a66af4);border-radius:20px;transition:width .4s}.progressrow{display:flex;align-items:center;gap:10px;margin:0 0 25px;color:#a54b76;font-size:.8rem;font-weight:800}.tiny{font-size:.85rem;color:#a36c87;margin-top:20px}.sticker-stage{display:flex;justify-content:center;align-items:center;gap:clamp(12px,5vw,28px);margin:10px auto 4px;min-height:66px}.sticker{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#fff,#ffe2ef);box-shadow:0 8px 18px #d65b9222;font-size:30px;animation:stickerFloat 2.2s ease-in-out infinite;transform-origin:center}.sticker:nth-child(2){animation-delay:.35s;animation-duration:2.7s}.sticker:nth-child(3){animation-delay:.7s;animation-duration:2.4s}@keyframes stickerFloat{0%,100%{transform:translateY(0) rotate(-7deg) scale(1)}50%{transform:translateY(-11px) rotate(8deg) scale(1.12)}}.sparkle{display:inline-block;animation:twinkle 1.5s infinite alternate}@keyframes twinkle{to{transform:rotate(18deg) scale(1.2);opacity:.6}}
/* Valentine surprise box */
.gift-stage{height:230px;display:grid;place-items:center;perspective:700px;margin:4px auto 10px}
.gift{position:relative;width:158px;height:126px;cursor:pointer;transform-style:preserve-3d;animation:roll 3.2s ease-in-out infinite;filter:drop-shadow(0 18px 17px #b54b7c35)}
@keyframes roll{0%,12%{transform:translateX(-95px) rotate(-13deg) rotateY(-12deg)}30%{transform:translateX(0) rotate(0)}48%{transform:translateX(75px) rotate(12deg) rotateY(12deg)}68%,100%{transform:translateX(0) rotate(0)}}
.gift-body{position:absolute;bottom:0;left:0;width:158px;height:104px;border-radius:10px 10px 16px 16px;background:linear-gradient(135deg,#ff8ab6,#e94388);border:2px solid #fff0f7}
.gift-body:before{content:"";position:absolute;left:64px;top:0;width:27px;height:100%;background:linear-gradient(90deg,#ffe6a6,#fff3cf,#ffd27b)}
.gift-lid{position:absolute;z-index:2;top:17px;left:-9px;width:176px;height:31px;border-radius:9px;background:linear-gradient(135deg,#ffb0cc,#ff5c9b);border:2px solid #fff0f7;transform-origin:12px 27px;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.gift-lid:before{content:"";position:absolute;left:73px;top:0;width:27px;height:100%;background:#ffe7a6}
.bow{position:absolute;z-index:3;top:-10px;left:57px;width:44px;height:30px}
.bow:before,.bow:after{content:"";position:absolute;width:27px;height:23px;border:7px solid #ffe8a5;border-radius:50% 50% 8px 50%;transform:rotate(28deg)}
.bow:after{left:17px;transform:scaleX(-1) rotate(28deg)}
.gift.opened .gift-lid{transform:translate(35px,-75px) rotate(-32deg)}
.gift.opened{animation:none;transform:translateY(-5px)}
.gift-heart{position:absolute;z-index:4;top:35px;left:64px;font-size:30px;animation:heartPop 1.3s ease-in-out infinite}
@keyframes heartPop{50%{transform:translateY(-24px) scale(1.3);opacity:.5}}
.gift-hint{font-weight:850;color:#b04478;letter-spacing:.03em}
@media(max-width:430px){.choices{grid-template-columns:1fr}.card{border-radius:25px}.topline{font-size:.65rem}.gift-stage{height:210px}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<main class="wrap"><section class="card" id="app" aria-live="polite"></section></main>
<script>
const games=[
 {tag:'Question 1 · A smile for my love',q:'Shamirah, do you know that just the thought of you can bring a smile to Alpha’s face?',correct:'Yes',why:'That smile is precious, sweetheart. I hope this little game brings one to your face too. 😊💗',stickers:['🥰','🌹','✨']},
 {tag:'Question 2 · My favourite queen',q:'Can we agree that this beautiful little Valentine surprise was made especially for its queen, Shamirah?',correct:'Yes',why:'That’s right, my queen! Today, every heart and every sparkle is here to celebrate you. 👑💐',stickers:['👑','💐','🦋']},
 {tag:'Question 3 · Two names, one story',q:'Do the names Alpha and Shamirah make this little love story extra special?',correct:'Yes',why:'Absolutely! Two names, one sweet story, and a page full of affection. 💞',stickers:['💑','💞','💫']},
 {tag:'Question 4 · Your beautiful smile',q:'Would you let yourself smile right now, knowing someone made this just to make you feel special?',correct:'Yes',why:'There it is! I hope that smile stays with you long after this game ends. 😊🌈',stickers:['😊','🌈','💗']},
 {tag:'Question 5 · Always appreciated',q:'Do you deserve to be reminded that you are precious, appreciated and worthy of gentle, genuine love?',correct:'Yes',why:'Every single day, Shamirah. Never forget how worthy you are of kindness and love. 💝',stickers:['💌','🌷','💖']},
 {tag:'Question 6 · Memories to treasure',q:'Wouldn’t it be lovely to collect little moments together that become beautiful memories to look back on?',correct:'Yes',why:'Yes! May the days ahead bring laughter, sweet surprises and memories worth keeping. 📸💕',stickers:['📸','🌸','💕']},
 {tag:'Question 7 · A hand to hold',q:'Is it beautiful when two people encourage each other, celebrate the good days and offer comfort on the hard ones?',correct:'Yes',why:'It really is. Love grows through patience, kindness and showing up for each other. 🤗❤️',stickers:['🤗','☀️','❤️']},
 {tag:'Question 8 · A place in my heart',q:'Does it make you happy to know that Shamirah has a special place in Alpha’s heart?',correct:'Yes',why:'A special place indeed, Shamirah — one that no pretty website could ever fully describe. 💓',stickers:['💓','🧸','🌹']},
 {tag:'Question 9 · The little things',q:'Should the small things you do — your laughter, your kindness and the way you are — be appreciated too?',correct:'Yes',why:'Yes, all of it! You don’t have to be perfect to be loved and appreciated. Just keep being wonderfully you. 🥰',stickers:['🥰','🎀','🌺']},
 {tag:'Question 10 · One last little question',q:'Are you ready, Shamirah, to open the final message Alpha wrote with love, just for you?',correct:'Yes',why:'You made it, my Valentine! Take a deep breath and open your heartfelt surprise. 💌',stickers:['💍','💗','🎉']}
];
let page=-1,unlocked=false;
const app=document.getElementById('app');
function hearts(){const box=document.getElementById('hearts');for(let i=0;i<25;i++){let e=document.createElement('span');e.className='heart';e.textContent=['♥','♡','💗','✦'][i%4];e.style.left=Math.random()*100+'%';e.style.fontSize=(14+Math.random()*24)+'px';e.style.animationDuration=(9+Math.random()*12)+'s';e.style.animationDelay=(-Math.random()*18)+'s';box.appendChild(e)}}
function renderGift(){app.innerHTML=`<div class="topline"><span>💌 A valentine surprise</span><span class="pill">Just for Shamirah</span></div><h1>Love You Babe 😘</h1><h2>A little gift for you, Shamirah</h2><p class="subtitle">Something sweet is waiting inside. Watch your little Valentine box roll… then tap it to open your surprise. 💗</p><div class="gift-stage"><div class="gift" id="gift" role="button" tabindex="0" aria-label="Open the Valentine gift" onclick="openGift()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openGift()}"><div class="gift-lid"></div><div class="bow"></div><div class="gift-body"></div><div class="gift-heart">💖</div></div></div><div class="gift-hint" id="giftHint">Tap the Valentine box to open it ✨</div><p class="tiny">A little surprise wrapped with love, kisses and sparkles.</p>`}
function openGift(){if(unlocked)return;unlocked=true;const gift=document.getElementById('gift');gift.classList.add('opened');document.getElementById('giftHint').textContent='Your surprise is opening… 💕';setTimeout(()=>{page=-1;renderIntro()},850)}
function renderIntro(){app.innerHTML=`<div class="topline"><span>💞 A game made with love</span><span class="pill">For Shamirah</span></div><div class="sticker-stage"><span class="sticker">🦋</span><span class="sticker">💝</span><span class="sticker">🌹</span></div><h1>Welcome, Shamirah!</h1><p class="subtitle">Your Valentine surprise is a little love quiz about <b>Alpha &amp; Shamirah</b>. Choose <b>Yes</b> or <b>No</b> for every question. If you get one wrong, don't worry — you stay right here and can try again. You must answer all ten correctly to reach the final message! 😘</p><button class="btn" onclick="next()">Start the love game 💗</button><p class="tiny">Ready, my Valentine? <span class="sparkle">✨</span></p>`}
function renderGame(){const g=games[page];app.innerHTML=`<div class="topline"><span>💞 Shamirah's love challenge</span><span class="pill">${page+1} / ${games.length}</span></div><div class="progressrow"><div class="progress"><div class="bar" style="width:${page/games.length*100}%"></div></div><span>${page} / ${games.length}</span></div><div class="sticker-stage">${g.stickers.map((st,i)=>`<span class="sticker" style="animation-delay:${i*.22}s">${st}</span>`).join('')}</div><div class="pill">${g.tag}</div><p class="question">${g.q}</p><div class="choices"><button class="choice" onclick="answer('Yes')">💗 Yes</button><button class="choice" onclick="answer('No')">💜 No</button></div><div class="feedback" id="feedback" aria-live="polite">Choose the answer you think is right, babe. 💕</div><div class="actions"><button class="btn" id="continue" onclick="next()" style="display:none">${page===games.length-1?'See your final surprise 💌':'Continue to next question →'}</button></div><p class="tiny">A wrong answer keeps you on this question. Only the correct answer unlocks the next one. 😘</p>`}
function answer(value){const g=games[page],feedback=document.getElementById('feedback');if(value===g.correct){feedback.className='feedback good';feedback.textContent='Correct! '+g.why;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('continue').style.display='inline-block'}else{feedback.className='feedback bad';feedback.textContent='Not quite, sweetheart! 💕 You need the other answer to unlock the next page. Try again!';}}
function next(){if(page<games.length-1){page++;renderGame()}else{renderEnd()}}
function renderEnd(){app.innerHTML=`<div class="topline"><span>💌 A message from Alpha</span><span class="pill">With all my heart</span></div><div class="sticker-stage"><span class="sticker">🧸</span><span class="sticker">💖</span><span class="sticker">🌹</span></div><div class="logo">💖</div><h1>My Dearest Shamirah</h1><h2>You are so special to me</h2><p class="subtitle" style="max-width:490px;text-align:left">My love, if you have reached this page, it means you completed every question in this little game. But the real prize is not the game — it is you. ❤️<br><br>Shamirah, I want you to know how deeply I love and appreciate you. Thank you for being part of my life, for the happiness you bring to my heart, and for all the little things that make you uniquely you. You are precious to me, and I never want you to doubt how much you mean to me.<br><br>I may not always have the perfect words or be able to give you everything you deserve, but my feelings for you are genuine. I want to keep making beautiful memories with you, supporting you, making you smile, and reminding you that you are loved. On your happy days, I want to celebrate with you; on your difficult days, I want to stand beside you and remind you that you are not alone.<br><br>Thank you for being you, my beautiful Shamirah. If I could choose again, I would still choose you. You have a special place in my heart, today and always. I love you more than these words can ever explain. 💗</p><div class="answer" style="display:block;padding:22px;border-radius:22px;background:linear-gradient(135deg,#ffe1ed,#eee2ff);color:#a32368;font-size:clamp(1.8rem,7vw,2.5rem);font-weight:950">Forever yours,<br>ALPHA ❤️</div><p class="question">All my love, all my appreciation, and a thousand kisses for you. 😘</p><div class="actions"><button class="btn" onclick="page=-1;unlocked=false;renderGift()">Relive our love game 💞</button></div><p class="tiny">Made with endless love, just for Shamirah ✨</p>`}
hearts();renderGift();
</script>
</body></html>
